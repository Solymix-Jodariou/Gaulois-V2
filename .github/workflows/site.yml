name: Données et site

on:
  schedule:
    # Toutes les heures. GitHub peut retarder les exécutions planifiées.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Une seule exécution à la fois, pour éviter les conflits sur data/.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # L'historique brut de la carte reste hors de Git. S'il est perdu, la collecte le retélécharge.
      - name: Restaurer l'historique de la carte
        uses: actions/cache/restore@v6
        with:
          path: .cache/clanmap
          key: clanmap-${{ github.run_id }}
          restore-keys: clanmap-
      - name: Collecter les données
        run: npm run data:fetch
      - name: Conserver l'historique de la carte
        if: ${{ !cancelled() && hashFiles('.cache/clanmap/events.bin') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/clanmap
          key: clanmap-${{ hashFiles('.cache/clanmap/events.bin') }}
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: mise à jour automatique"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      # La tâche du jeu. Sans réglages, elle ne s'exécute pas, et une panne n'empêche jamais le site de se publier.
      - name: Tâche de la Conquête
        if: ${{ !cancelled() && vars.SUPABASE_URL != '' }}
        continue-on-error: true
        run: npm run conquete:job
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Garder la sauvegarde chiffrée
        if: ${{ !cancelled() && hashFiles('.cache/conquete-backup/*') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sauvegarde-conquete-${{ github.run_id }}
          path: .cache/conquete-backup/
          retention-days: 14

  # Les règles du jeu, sur un vrai Postgres. Un échec se voit ici, sans empêcher le site de se publier.
  test-db:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db

  build:
    needs: update-data
    # Sur un push, update-data est ignoré : le site se reconstruit quand même.
    if: ${{ !cancelled() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - id: pages
        uses: actions/configure-pages@v6
      - name: Construire le site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Sans ces deux valeurs, le jeu n'apparaît pas et le site reste entièrement statique.
          PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
